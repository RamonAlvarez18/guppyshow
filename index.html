<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guppy Show Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3F5; --surface:#FFFFFF; --surface-2:#F4F9FA; --ink:#10262F; --muted:#56707A; --line:#C9DBE0;
  --brand:#0B6B7D; --brand-ink:#FFFFFF; --brand-soft:#D6ECF0;
  --accent:#B3266F; --accent-soft:#F8DDEB;
  --gold:#C99700; --silver:#8794A0; --bronze:#B06A34;
  --ok:#1E7F4F; --ok-soft:#DAF1E4; --warn:#9A5B00; --warn-soft:#FBEBCB; --danger:#B42318; --danger-soft:#FBDDD9;
  --shadow:0 1px 2px rgba(16,38,47,.06), 0 4px 14px rgba(16,38,47,.05);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A171C; --surface:#12262E; --surface-2:#0F1F26; --ink:#E3EEF1; --muted:#8FA9B2; --line:#25404A;
    --brand:#4DB8CB; --brand-ink:#052129; --brand-soft:#123943;
    --accent:#F26BAB; --accent-soft:#3A1830;
    --gold:#E3B72E; --silver:#A9B5BF; --bronze:#D08A54;
    --ok:#52C688; --ok-soft:#12352A; --warn:#E8B04A; --warn-soft:#3A2C0F; --danger:#FF8A7D; --danger-soft:#3E1B18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0A171C; --surface:#12262E; --surface-2:#0F1F26; --ink:#E3EEF1; --muted:#8FA9B2; --line:#25404A;
  --brand:#4DB8CB; --brand-ink:#052129; --brand-soft:#123943;
  --accent:#F26BAB; --accent-soft:#3A1830;
  --gold:#E3B72E; --silver:#A9B5BF; --bronze:#D08A54;
  --ok:#52C688; --ok-soft:#12352A; --warn:#E8B04A; --warn-soft:#3A2C0F; --danger:#FF8A7D; --danger-soft:#3E1B18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:.85rem}
.wrap{max-width:1080px;margin:0 auto;padding:0 1rem}

/* header */
.top{background:var(--brand);color:var(--brand-ink);padding:1.1rem 0 0}
:root[data-theme="dark"] .top{background:var(--surface)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{background:var(--surface)}}
.top .wrap{display:flex;flex-wrap:wrap;gap:.6rem 1.5rem;align-items:flex-end;justify-content:space-between}
.top h1{font-size:clamp(1.6rem,4.5vw,2.4rem);font-weight:800;color:inherit}
:root[data-theme="dark"] .top h1{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top h1{color:var(--ink)}}
.top .meta{font-size:.95rem;opacity:.85;min-height:1.4em}
.sync{appearance:none;border:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;font-size:.82rem;padding:.25rem .65rem;border-radius:99px;background:rgba(255,255,255,.16);white-space:nowrap}
:root[data-theme="dark"] .sync{background:var(--surface-2);color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sync{background:var(--surface-2);color:var(--muted)}}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:#7CE3A6}
.dot.local{background:#F5C25B}.dot.err{background:#FF8A7D}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);margin-top:.9rem}
:root[data-theme="dark"] nav.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs{background:var(--surface);border-bottom:1px solid var(--line)}}
nav.tabs .wrap{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none}
nav.tabs button{appearance:none;border:0;background:transparent;color:inherit;font:600 .95rem var(--body);padding:.8rem 1rem;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;color:var(--brand-ink);opacity:.8}
:root[data-theme="dark"] nav.tabs button{color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs button{color:var(--muted)}}
nav.tabs button[aria-current="page"]{opacity:1;border-bottom-color:var(--accent-soft)}
:root[data-theme="dark"] nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}}
nav.tabs .count{font-size:.75rem;background:rgba(255,255,255,.22);border-radius:99px;padding:.05rem .45rem;margin-left:.3rem}
:root[data-theme="dark"] nav.tabs .count{background:var(--brand-soft)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs .count{background:var(--brand-soft)}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

main{padding:1.25rem 0 3rem}
.grid2{display:grid;gap:1rem;grid-template-columns:1fr}
@media (min-width:860px){.grid2{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem;box-shadow:var(--shadow)}
.card + .card{margin-top:1rem}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:.9rem;flex-wrap:wrap}

/* forms */
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.85rem}
.field label,.lbl{font-size:.88rem;font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{
  font:inherit;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:9px;padding:.6rem .7rem;width:100%;min-height:2.75rem}
textarea{min-height:4.5rem;resize:vertical}
input:disabled,select:disabled{opacity:.6}
.two{display:grid;gap:.75rem;grid-template-columns:1fr}
@media (min-width:560px){.two{grid-template-columns:1fr 1fr}}
.check{display:flex;gap:.6rem;align-items:flex-start;font-size:.95rem;margin-bottom:.7rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.15rem;accent-color:var(--brand);flex:none}
.hint{font-size:.83rem;color:var(--muted)}

.btn{appearance:none;border:1.5px solid transparent;border-radius:10px;font:600 .95rem var(--body);padding:.62rem 1rem;min-height:2.75rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;text-decoration:none}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.accent{background:var(--accent);color:#fff}
.btn.secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{min-height:2.1rem;padding:.3rem .65rem;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.secondary.sm.danger-text{color:var(--danger)}

/* bench tag: the show's signature object */
.tag{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:3.6rem;height:2.4rem;padding:0 .7rem 0 1.35rem;border:2px solid var(--brand);border-radius:8px;color:var(--brand);font:800 1.15rem var(--display);font-variant-numeric:tabular-nums;background:var(--surface);flex:none}
.tag::before{content:"";position:absolute;left:.42rem;top:50%;width:.42rem;height:.42rem;margin-top:-.21rem;border-radius:50%;border:2px solid var(--brand);background:var(--bg)}
.tag.big{height:3.3rem;min-width:5rem;font-size:1.6rem;padding-left:1.7rem}
.tag.big::before{left:.6rem;width:.55rem;height:.55rem;margin-top:-.275rem}
.tag.done{background:var(--brand);color:var(--brand-ink)}
.tag.done::before{background:var(--brand);border-color:var(--brand-ink)}
.tag.dq{border-color:var(--danger);color:var(--danger)}
.tag.dq::before{border-color:var(--danger)}

.chip{display:inline-flex;align-items:center;gap:.3rem;font:600 .78rem var(--body);padding:.15rem .6rem;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
button.chip{cursor:pointer;min-height:1.9rem}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.info{background:var(--brand-soft);color:var(--brand);border-color:transparent}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
.stat{background:var(--surface-2);border-radius:10px;padding:.7rem .85rem}
.stat b{display:block;font:800 1.6rem var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}

/* registration rows */
.row-entry{display:grid;gap:.5rem;grid-template-columns:1fr;padding:.75rem;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;margin-bottom:.6rem}
@media (min-width:600px){.row-entry{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;align-items:center}}
.done-tags{display:flex;flex-wrap:wrap;gap:.6rem;margin:.9rem 0}
.done-item{display:flex;align-items:center;gap:.6rem;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:.5rem .75rem}
.recent{list-style:none;margin:0;padding:0}
.recent li{display:flex;gap:.7rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--line)}
.recent li:first-child{border-top:0}
.recent .who{min-width:0}
.recent .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tables */
.tablewrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:.6rem .75rem;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line)}
th{font-size:.82rem;font-weight:600;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.dim td{opacity:.55}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.actions{white-space:nowrap;display:flex;gap:.3rem}
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.9rem;align-items:center}
.toolbar .grow{flex:1 1 220px}
.toolbar select{width:auto;min-width:11rem}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 1.05rem var(--display);margin-bottom:.25rem}

/* judging */
.judgebar{display:grid;gap:.75rem;grid-template-columns:1fr}
@media (min-width:640px){.judgebar{grid-template-columns:1fr 1.4fr}}
.entrygrid{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.entrybtn{appearance:none;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.75rem;display:flex;gap:.75rem;align-items:center;cursor:pointer;min-height:4.2rem}
.entrybtn:hover{border-color:var(--brand)}
.entrybtn .txt{min-width:0;display:flex;flex-direction:column;gap:.15rem}
.entrybtn .txt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress{height:.5rem;background:var(--line);border-radius:99px;overflow:hidden;margin-top:.4rem}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px}

/* scoring modal */
.crit{display:grid;grid-template-columns:1fr auto;gap:.3rem .8rem;align-items:center;padding:.65rem 0;border-top:1px solid var(--line)}
.crit:first-of-type{border-top:0}
.crit label{font-weight:600}
.crit .max{color:var(--muted);font-weight:400;font-size:.85rem}
.crit input[type=range]{grid-column:1;width:100%;accent-color:var(--brand);min-height:2rem}
.crit input[type=number]{grid-column:2;grid-row:1 / span 2;width:5rem;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.totalbar{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:.7rem 1rem;margin:.6rem 0 1rem}
.totalbar strong{font:800 2rem var(--display);font-variant-numeric:tabular-nums}
.dqbox{background:var(--danger-soft);border-radius:10px;padding:.7rem .85rem;margin-bottom:1rem}
.dqbox .check{margin-bottom:.4rem;color:var(--danger);font-weight:600}
.dqbox input[type=text]{background:var(--surface)}

/* results */
.classblock{margin-bottom:1.4rem}
.classblock h3{margin-bottom:.5rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.rosette{position:relative;display:inline-flex;align-items:center;justify-content:center;width:2.2rem;height:2.2rem;border-radius:50%;font:800 .95rem var(--display);color:#fff;background:var(--silver);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--silver)}
.rosette.p1{background:var(--gold);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--gold)}
.rosette.p2{background:var(--silver);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--silver)}
.rosette.p3{background:var(--bronze);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--bronze)}
.rosette.pn{background:transparent;color:var(--muted);box-shadow:none;border:1.5px solid var(--line)}
.bis{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:1.6rem}
.bis .card{margin:0;display:flex;gap:.8rem;align-items:center}
.bis .card.first{border-color:var(--gold);border-width:2px}
.score{font:800 1.15rem var(--display);font-variant-numeric:tabular-nums}
.blur{filter:blur(6px);user-select:none}

/* setup */
.listrow{display:grid;grid-template-columns:1fr auto;gap:.4rem;margin-bottom:.5rem;align-items:center}
.listrow .btns{display:flex;gap:.25rem}
.critrow{display:grid;grid-template-columns:1fr 5.5rem auto;gap:.4rem;margin-bottom:.5rem;align-items:center}
.danger-zone{border-color:var(--danger)}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(6,20,26,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 1rem) 1rem calc(env(safe-area-inset-bottom,0px) + 1rem);overflow-y:auto}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;width:100%;max-width:520px;padding:1.2rem;margin:auto 0;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-head{display:flex;gap:.9rem;align-items:center;margin-bottom:.9rem}
.modal .btnrow{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.modal pre{max-height:50vh;overflow:auto;background:var(--surface-2);padding:.7rem;border-radius:8px;font-size:.8rem;white-space:pre;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.65rem 1.1rem;border-radius:99px;font-weight:600;font-size:.92rem;z-index:80;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.loading{padding:4rem 1rem;text-align:center;color:var(--muted)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:.7rem .9rem;margin-bottom:1rem;font-size:.93rem}
.notice.info{background:var(--brand-soft);color:var(--brand)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div>
      <h1 id="showName">Guppy show</h1>
      <div class="meta" id="showMeta"></div>
    </div>
    <button class="sync" id="sync" data-action="account" aria-label="Account and connection details"><span class="dot local"></span><span>Connecting</span></button>
  </div>
  <nav class="tabs" aria-label="Sections">
    <div class="wrap" id="tabs"></div>
  </nav>
</header>

<div class="wrap" id="banner"></div>
<main class="wrap" id="view"><div class="loading">Opening the show desk…</div></main>

<div id="modalRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { initializeApp as fbInit, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc as fsDoc, collection as fsCollection, onSnapshot as fsOnSnapshot,
         query as fsQuery, where as fsWhere,
         setDoc, updateDoc, deleteDoc, getDocs, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
         createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* =====================================================================
   STEP 5 OF THE SETUP GUIDE: PASTE YOUR FIREBASE CONFIG BELOW.
   Replace the whole block between the braces with the one Firebase gives you.
   ===================================================================== */
const FIREBASE_CONFIG = {
 apiKey: "AIzaSyDYnMgw_56BNvSkZtT6m8ykmnB5BhMPKGc",
  authDomain: "guppy-show.firebaseapp.com",
  projectId: "guppy-show",
  storageBucket: "guppy-show.firebasestorage.app",
  messagingSenderId: "564863930093",
  appId: "1:564863930093:web:c889e6ee5843906a6c06e4"
};
/* ===================================================================== */

const FIREBASE_READY = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId &&
  !/^PASTE/.test(FIREBASE_CONFIG.apiKey) && !/^PASTE/.test(FIREBASE_CONFIG.projectId));
const authMode = FIREBASE_READY;
const ROLE_LABEL = {admin:'Admin', registrar:'Registrar', judge:'Judge'};

(function(){
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const num = (v, d=0) => { const n = parseFloat(v); return isFinite(n) ? n : d; };
const fmt = n => String(Math.round(n * 100) / 100);
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, v); } catch(e){} }
};

/* ---------- defaults ---------- */
const DEFAULT_CONFIG = () => ({
  name: 'Guppy show',
  date: '',
  venue: '',
  fee: 0,
  currency: '₱',
  open: true,
  anonymous: true,
  maxPerClass: 0,
  judgesPerEntry: 1,
  classes: [
    {id:'delta',  name:'Delta tail males'},
    {id:'fancy',  name:'Fancy tail males (fan, pin, lyre)'},
    {id:'solid',  name:'Solid colour males'},
    {id:'pattern',name:'Snakeskin and pattern males'},
    {id:'females',name:'Females'},
    {id:'junior', name:'Juniors (under 16)'},
    {id:'pairs',  name:'Pairs (male and female)'},
    {id:'trios',  name:'Trios'}
  ],
  criteria: [
    {id:'body',      name:'Body and shape',        max:20},
    {id:'dorsal',    name:'Dorsal fin',            max:15},
    {id:'caudal',    name:'Caudal (tail) fin',     max:25},
    {id:'colour',    name:'Colour and pattern',    max:20},
    {id:'symmetry',  name:'Symmetry and finnage',  max:10},
    {id:'condition', name:'Condition and deportment', max:10}
  ]
});
const mergeCfg = c => {
  const d = DEFAULT_CONFIG();
  const m = Object.assign(d, c || {});
  if (!Array.isArray(m.classes) || !m.classes.length) m.classes = d.classes;
  if (!Array.isArray(m.criteria) || !m.criteria.length) m.criteria = d.criteria;
  return m;
};

/* ---------- state ---------- */
const S = {
  config: DEFAULT_CONFIG(), entries: [], scores: [],
  tab: 'register', ready: false, mode: 'local', sync: 'connecting',
  judge: ls.get('gs:judge') || '', judgeClass: '', resultClass: '', reveal: false,
  regDone: null, fatal: false, me: null, users: [], pub: [], priv: {}
};
let db = null;

function makeDb(store){
  const dref = p => fsDoc(store, ...p.split('/'));
  const wrap = d => ({id: d.id, exists: d.exists(), data: () => d.data()});
  const col = ref => ({
    get: async () => { const q = await getDocs(ref); return {docs: q.docs.map(wrap)}; },
    onSnapshot: (next, err) => fsOnSnapshot(ref, q => next({docs: q.docs.map(wrap)}), err),
    where: (f, o, v) => col(fsQuery(ref, fsWhere(f, o, v)))
  });
  return {
    doc: p => ({
      set: d => setDoc(dref(p), d),
      update: d => updateDoc(dref(p), d),
      delete: () => deleteDoc(dref(p)),
      onSnapshot: (next, err) => fsOnSnapshot(dref(p), s => next(wrap(s)), err)
    }),
    collection: p => col(fsCollection(store, p)),
    allocate: (n, floor) => runTransaction(store, async tx => {
      const ref = dref('meta/counter');
      const snap = await tx.get(ref);
      const cur = snap.exists() ? (snap.data().next || 1) : 1;
      const start = Math.max(cur, floor);
      tx.set(ref, {next: start + n});
      return start;
    })
  };
}

const local = {config:null, entries:{}, scores:{}, counter:0};
function loadLocal(){ try { const j = JSON.parse(ls.get('gs:data') || 'null'); if (j) Object.assign(local, j); } catch(e){} }
function saveLocal(){ ls.set('gs:data', JSON.stringify(local)); }
function pullLocal(){ S.config = mergeCfg(local.config); S.entries = Object.values(local.entries); S.scores = Object.values(local.scores).map(x => Object.assign({}, x, {judgeUid: x.judgeUid || x.judgeId})); }

const scoreKey = (entryId, uid) => entryId + '__' + uid;
const judgeIdOf = name => (String(name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)) || 'judge';

const PUB_FIELDS = ['no','class','strain','status','dq','dqReason','ts','sample'];
const PRIV_FIELDS = ['exhibitor','club','contact','paid'];
const pick = (o, keys) => { const r = {}; keys.forEach(k => { if (o[k] !== undefined) r[k] = o[k]; }); return r; };
const myRole = () => S.me ? S.me.role : 'admin';
const myUid = () => S.me ? S.me.uid : judgeIdOf(S.judge);
const myName = () => S.me ? S.me.name : S.judge.trim();

const API = {
  async saveConfig(c){
    if (db) await db.doc('config/show').set(c);
    else { local.config = c; saveLocal(); pullLocal(); }
  },
  async putEntry(e){
    if (db) { await db.doc('entries/' + e.id).set(pick(e, PUB_FIELDS)); await db.doc('private/' + e.id).set(pick(e, PRIV_FIELDS)); }
    else { local.entries[e.id] = e; saveLocal(); pullLocal(); }
  },
  async patchEntry(id, p){
    if (db) {
      const a = pick(p, PUB_FIELDS), b = pick(p, PRIV_FIELDS);
      if (Object.keys(a).length) await db.doc('entries/' + id).update(a);
      if (Object.keys(b).length) await db.doc('private/' + id).update(b);
    } else { Object.assign(local.entries[id] || {}, p); saveLocal(); pullLocal(); }
  },
  async delEntry(id){
    const mine = S.scores.filter(s => s.entryId === id);
    if (db) {
      for (const s of mine) await db.doc('scores/' + scoreKey(id, s.judgeUid)).delete();
      await db.doc('entries/' + id).delete();
      await db.doc('private/' + id).delete();
    } else {
      mine.forEach(s => delete local.scores[scoreKey(id, s.judgeUid)]);
      delete local.entries[id]; saveLocal(); pullLocal();
    }
  },
  async putScore(s){
    if (db) await db.doc('scores/' + scoreKey(s.entryId, s.judgeUid)).set(s);
    else { local.scores[scoreKey(s.entryId, s.judgeUid)] = s; saveLocal(); pullLocal(); }
  },
  async delScore(entryId, uid){
    if (db) await db.doc('scores/' + scoreKey(entryId, uid)).delete();
    else { delete local.scores[scoreKey(entryId, uid)]; saveLocal(); pullLocal(); }
  },
  async putUser(uid, d){ await db.doc('users/' + uid).set(d); },
  async patchUser(uid, p){ await db.doc('users/' + uid).update(p); },
  async delUser(uid){ await db.doc('users/' + uid).delete(); },
  async alloc(n){
    const floor = S.entries.reduce((m, e) => Math.max(m, e.no || 0), 0) + 1;
    if (!db) {
      const start = Math.max(local.counter + 1, floor);
      local.counter = start + n - 1; saveLocal(); return start;
    }
    return db.allocate(n, floor);
  },
  async resetAll(){
    if (db) {
      for (const col of ['entries','private','scores']) {
        const snap = await db.collection(col).get();
        for (const d of snap.docs) await db.doc(col + '/' + d.id).delete();
      }
      await db.doc('meta/counter').set({next: 1});
    } else {
      local.entries = {}; local.scores = {}; local.counter = 0; saveLocal(); pullLocal();
    }
  }
};

const cfg = () => S.config;
const className = id => { const c = cfg().classes.find(c => c.id === id); return c ? c.name : 'Unknown class'; };
const totalOf = s => cfg().criteria.reduce((a, c) => a + (num(s.points && s.points[c.id])), 0);
const maxTotal = () => cfg().criteria.reduce((a, c) => a + c.max, 0);
const activeEntries = () => S.entries.filter(e => e.status !== 'scratched');
const byNo = (a, b) => (a.no || 0) - (b.no || 0);
const money = n => (cfg().currency || '') + Number(n || 0).toLocaleString(undefined, {maximumFractionDigits: 2});
const myScore = entryId => S.scores.find(s => s.entryId === entryId && s.judgeUid === myUid());

function standings(classId){
  const inClass = S.entries.filter(e => e.class === classId && e.status !== 'scratched');
  const rows = inClass.filter(e => !e.dq).map(e => {
    const sc = S.scores.filter(s => s.entryId === e.id);
    const totals = sc.map(totalOf);
    return {e, sc, n: totals.length, avg: totals.length ? totals.reduce((a,b) => a+b, 0) / totals.length : null};
  });
  const scored = rows.filter(r => r.n > 0).sort((a,b) => (b.avg - a.avg) || (a.e.no - b.e.no));
  scored.forEach((r, i) => {
    r.place = (i > 0 && Math.abs(r.avg - scored[i-1].avg) < 1e-9) ? scored[i-1].place : i + 1;
  });
  scored.forEach(r => { r.tie = scored.some(o => o !== r && o.place === r.place); });
  return {scored, pending: rows.filter(r => r.n === 0), dq: inClass.filter(e => e.dq)};
}
const ordinal = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v-20)%10] || s[v] || s[0]); };

async function exportFile(filename, text){

    const blob = new Blob(['\ufeff' + text], {type: 'text/csv;charset=utf-8'});

async function doRegister(){
  const name = $('#exName').value.trim();
  if (!name) { toast('Enter the exhibitor name'); $('#exName').focus(); return; }
  const rows = $$('.row-entry').map(r => ({cls: $('.r-class', r).value, strain: $('.r-strain', r).value.trim()}));
  if (rows.some(r => !r.cls)) { toast('Choose a class for every entry'); return; }
  const max = num(cfg().maxPerClass);
  if (max > 0) {
    const counts = {};
    activeEntries().filter(e => (e.exhibitor||'').trim().toLowerCase() === name.toLowerCase()).forEach(e => counts[e.class] = (counts[e.class]||0) + 1);
    rows.forEach(r => counts[r.cls] = (counts[r.cls]||0) + 1);
    const over = Object.keys(counts).find(k => counts[k] > max);
    if (over) { toast(name + ' can enter at most ' + max + ' in ' + className(over)); return; }
  }
  const btn = $('#regGo'); btn.disabled = true; btn.textContent = 'Registering…';
  try {
    const start = await API.alloc(rows.length);
    const club = $('#exClub').value.trim(), contact = $('#exContact').value.trim(), paid = $('#exPaid').checked;
    const items = [];
    for (let i = 0; i < rows.length; i++) {
      const e = {id: 'e' + uid(), no: start + i, exhibitor: name, club, contact, class: rows[i].cls, strain: rows[i].strain, paid, status: 'active', dq: false, dqReason: '', ts: Date.now() + i};
      await API.putEntry(e);
      items.push({no: e.no, cls: e.class, strain: e.strain});
    }
    S.regDone = {name, items, paid, fee: rows.length * num(cfg().fee)};
    TABS.register.mount(); TABS.register.update();
  } catch(err) {
    toast(err && err.message ? err.message : 'Could not save. Try again.');
    btn.disabled = false; btn.textContent = 'Register entries';
  }
}

function openScore(id){
  if (!myName()) { toast('Enter your name first'); const n = $('#jName'); if (n) n.focus(); return; }
  const e = S.entries.find(x => x.id === id); if (!e) return;
  const ms = myScore(id), pts = (ms && ms.points) || {};
  const crits = cfg().criteria.map(c => {
    const v = num(pts[c.id]);
    return '<div class="crit"><label for="n_' + c.id + '">' + esc(c.name) + ' <span class="max">out of ' + c.max + '</span></label>' +
      '<input type="range" id="r_' + c.id + '" data-crit="' + c.id + '" min="0" max="' + c.max + '" step="0.5" value="' + v + '" aria-label="' + esc(c.name) + ' slider">' +
      '<input type="number" id="n_' + c.id + '" data-crit="' + c.id + '" min="0" max="' + c.max + '" step="0.5" inputmode="decimal" value="' + v + '"></div>';
  }).join('');
  openModal('<div class="modal-head"><span class="tag big">' + e.no + '</span><div><h2>' + esc(className(e.class)) + '</h2><div class="sub">' +
    (cfg().anonymous ? esc(e.strain || 'Anonymous entry') : esc((e.strain || 'Entry') + (e.exhibitor ? ' by ' + e.exhibitor : ''))) + '</div></div></div>' +
    '<div id="crits">' + crits + '</div>' +
    '<div class="totalbar"><span>Total</span><span><strong id="tot">0</strong> / ' + maxTotal() + '</span></div>' +
    '<div class="field"><label for="sNotes">Notes <span class="muted">(optional, only you and the results table see these)</span></label><textarea id="sNotes">' + esc(ms ? ms.notes : '') + '</textarea></div>' +
    '<div class="dqbox"><label class="check"><input type="checkbox" id="sDq"' + (e.dq ? ' checked' : '') + '><span>Disqualify this entry</span></label>' +
    '<input type="text" id="sDqWhy" placeholder="Reason, e.g. wrong class or diseased fish" value="' + esc(e.dqReason) + '" aria-label="Disqualification reason"></div>' +
    '<div class="btnrow"><button class="btn primary" id="sSave">Save score</button><button class="btn accent" id="sNext">Save and next</button>' +
    (ms ? '<button class="btn secondary" id="sClear">Remove my score</button>' : '') + '<button class="btn secondary" data-action="close-modal">Cancel</button></div>',
    m => {
      const recalc = () => { $('#tot', m).textContent = fmt(cfg().criteria.reduce((a, c) => a + num($('#n_' + c.id, m).value), 0)); };
      recalc();
      $('#crits', m).addEventListener('input', ev => {
        const t = ev.target, cid = t.getAttribute('data-crit'); if (!cid) return;
        const crit = cfg().criteria.find(c => c.id === cid);
        let v = Math.min(crit.max, Math.max(0, num(t.value)));
        if (t.type === 'range') $('#n_' + cid, m).value = v; else $('#r_' + cid, m).value = v;
        recalc();
      });
      const save = async goNext => {
        const points = {};
        cfg().criteria.forEach(c => { points[c.id] = Math.min(c.max, Math.max(0, num($('#n_' + c.id, m).value))); });
        const dq = $('#sDq', m).checked, why = $('#sDqWhy', m).value.trim();
        try {
          await API.putScore({entryId: id, judgeUid: myUid(), judge: myName(), points, notes: $('#sNotes', m).value.trim(), ts: Date.now()});
          if (dq !== !!e.dq || (dq && why !== (e.dqReason || ''))) await API.patchEntry(id, {dq, dqReason: dq ? why : ''});
        } catch(err) { toast('Could not save. Try again.'); return; }
        closeModal();
        if (goNext) {
          const list = activeEntries().filter(x => x.class === e.class).sort(byNo);
          const idx = list.findIndex(x => x.id === id);
          const nxt = list.slice(idx + 1).concat(list.slice(0, idx)).find(x => !myScore(x.id) && !x.dq);
          if (nxt) { openScore(nxt.id); return; }
          toast('That was the last unscored entry in this class');
        } else toast('Score saved');
      };
      $('#sSave', m).onclick = () => save(false);
      $('#sNext', m).onclick = () => save(true);
      const clr = $('#sClear', m);
      if (clr) clr.onclick = async () => { await API.delScore(id, myUid()); closeModal(); toast('Your score was removed'); };
    });
}

function exportEntries(){
  const rows = [['No','Class','Strain','Exhibitor','Club','Contact','Paid','Status','Disqualified reason']];
  S.entries.slice().sort(byNo).forEach(e => rows.push([e.no, className(e.class), e.strain, e.exhibitor, e.club, e.contact, e.paid ? 'Yes' : 'No', e.status === 'scratched' ? 'Scratched' : e.dq ? 'Disqualified' : 'Entered', e.dqReason]));
  exportFile('entries.csv', toCsv(rows));
}
function exportResults(){
  const rows = [['Class','Place','No','Strain','Exhibitor','Average','Scores','Judges']];
  cfg().classes.forEach(c => {
    standings(c.id).scored.forEach(r => rows.push([c.name, r.place, r.e.no, r.e.strain, r.e.exhibitor, fmt(r.avg), r.n, r.sc.map(s => s.judge + ': ' + fmt(totalOf(s))).join('; ')]));
  });
  exportFile('results.csv', toCsv(rows));
}

/* ---------- events ---------- */
const ACTIONS = {
  'account': () => openAccount(),
  'login': async el => {
    const email = $('#lEmail').value.trim(), pw = $('#lPw').value;
    if (!email || !pw) { toast('Enter your email and password'); return; }
    el.disabled = true;
    try { await signInWithEmailAndPassword(auth, email, pw); }
    catch(e) { toast(authMsg(e && e.code)); el.disabled = false; }
  },
  'forgot': async () => {
    const email = $('#lEmail').value.trim();
    if (!email) { toast('Type your email above first'); $('#lEmail').focus(); return; }
    try { await sendPasswordResetEmail(auth, email); } catch(e) { if (e && e.code === 'auth/invalid-email') { toast(authMsg(e.code)); return; } }
    toast('If that email has an account, a reset link is on its way');
  },
  'logout': async () => { closeModal(); try { await signOut(auth); } catch(e){} },
  'reset-mine': async () => { try { await sendPasswordResetEmail(auth, S.me.email); toast('Reset link sent to ' + S.me.email); } catch(e){ toast(authMsg(e && e.code)); } },
  'user-add': () => createUser(),
  'user-gen-pw': () => { $('#uPw').value = genPw(); },
  'user-reset': async el => { try { await sendPasswordResetEmail(auth, el.dataset.email); toast('Reset link sent to ' + el.dataset.email); } catch(e){ toast(authMsg(e && e.code)); } },
  'user-toggle': async el => { const u = S.users.find(x => x.id === el.dataset.uid); if (u) { await API.patchUser(u.id, {disabled: !u.disabled}); toast(u.disabled ? u.name + ' can sign in again' : u.name + ' is switched off'); } },
  'user-remove': async el => {
    const u = S.users.find(x => x.id === el.dataset.uid); if (!u) return;
    if (await confirmModal({title: 'Remove ' + (u.name || u.email) + '?', body: 'They lose all access to the show. Their scores stay. To let them back in later, add them again with a different email, or switch them off instead.', confirm: 'Remove person', danger: true})) { await API.delUser(u.id); toast('Removed'); }
  },
  'tab': el => switchTab(el.dataset.tab),
  'overlay': (el, ev) => { if (ev.target === el) closeModal(); },
  'close-modal': () => closeModal(),
  'add-row': () => { $('#rows').insertAdjacentHTML('beforeend', rowHtml()); TABS.register.updateFee(); },
  'rm-row': el => { if ($$('.row-entry').length > 1) { el.closest('.row-entry').remove(); TABS.register.updateFee(); } else toast('Keep at least one entry'); },
  'register': () => doRegister(),
  'reg-again': () => { S.regDone = null; TABS.register.mount(); TABS.register.update(); },
  'toggle-paid': async el => { const e = S.entries.find(x => x.id === el.dataset.id); if (e) await API.patchEntry(e.id, {paid: !e.paid}); },
  'edit-entry': el => editEntry(el.dataset.id),
  'scratch': async el => { const e = S.entries.find(x => x.id === el.dataset.id); if (e) { await API.patchEntry(e.id, {status: e.status === 'scratched' ? 'active' : 'scratched'}); toast(e.status === 'scratched' ? 'Entry ' + e.no + ' restored' : 'Entry ' + e.no + ' scratched'); } },
  'del-entry': async el => {
    const e = S.entries.find(x => x.id === el.dataset.id); if (!e) return;
    if (await confirmModal({title: 'Delete entry ' + e.no + '?', body: 'This removes the entry and any scores for it. Use Scratch instead if the fish simply did not show up.', confirm: 'Delete entry', danger: true})) { await API.delEntry(e.id); toast('Entry deleted'); }
  },
  'export-entries': () => exportEntries(),
  'export-results': () => exportResults(),
  'score': el => openScore(el.dataset.id),
  'reveal': () => { S.reveal = !S.reveal; TABS.results.update(); },
  'add-class': () => { readSetup(); setupDraft.classes.push({id: 'c' + uid(), name: ''}); setupDirty = true; TABS.setup.mount(); const r = $$('.cls-row'); $('input', r[r.length-1]).focus(); },
  'cls-rm': el => {
    readSetup(); const c = setupDraft.classes[+el.dataset.i];
    if (S.entries.some(e => e.class === c.id)) { toast('This class has entries. Move or delete them first.'); return; }
    if (setupDraft.classes.length <= 1) { toast('Keep at least one class'); return; }
    setupDraft.classes.splice(+el.dataset.i, 1); setupDirty = true; TABS.setup.mount();
  },
  'cls-up': el => { readSetup(); const i = +el.dataset.i, a = setupDraft.classes; if (i > 0) { [a[i-1], a[i]] = [a[i], a[i-1]]; setupDirty = true; TABS.setup.mount(); } },
  'cls-down': el => { readSetup(); const i = +el.dataset.i, a = setupDraft.classes; if (i < a.length - 1) { [a[i+1], a[i]] = [a[i], a[i+1]]; setupDirty = true; TABS.setup.mount(); } },
  'add-crit': () => { readSetup(); setupDraft.criteria.push({id: 'k' + uid(), name: '', max: 10}); setupDirty = true; TABS.setup.mount(); const r = $$('.crit-row'); $('.cr-name', r[r.length-1]).focus(); },
  'crit-rm': el => { readSetup(); if (setupDraft.criteria.length <= 1) { toast('Keep at least one criterion'); return; } setupDraft.criteria.splice(+el.dataset.i, 1); setupDirty = true; TABS.setup.mount(); },
  'save-setup': () => saveSetup(),
  'sample-data': () => addSamples(),
  'reset-data': async () => {
    if (await confirmModal({title: 'Delete all entries and scores?', body: 'Every entry and every judge score will be removed for everyone using this show. This cannot be undone.', confirm: 'Delete everything', danger: true, type: 'RESET'})) {
      try { await API.resetAll(); toast('Show cleared'); } catch(e){ toast('Could not clear the show'); }
    }
  }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]'); if (!el) return;
  const fn = ACTIONS[el.dataset.action]; if (fn) { if (el.tagName === 'A') ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#modalRoot').firstChild) closeModal(); });
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'jName') { S.judge = t.value; ls.set('gs:judge', t.value); TABS.judging.update(); }
  else if (t.id === 'eSearch') TABS.entries.update();
  else if (t.id === 'exName') {
    const m = S.entries.find(e => (e.exhibitor || '').toLowerCase() === t.value.trim().toLowerCase());
    if (m) { if (!$('#exClub').value) $('#exClub').value = m.club || ''; if (!$('#exContact').value) $('#exContact').value = m.contact || ''; }
  }
  else if (t.closest && t.closest('#view') && S.tab === 'setup') {
    setupDirty = true;
    if (t.classList.contains('cr-max')) $('#critTotal').textContent = fmt($$('.cr-max').reduce((a, i) => a + num(i.value), 0));
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.classList && t.classList.contains('u-role')) { API.patchUser(t.dataset.uid, {role: t.value}).then(() => toast('Role updated')); }
  else if (t.id === 'eClass' || t.id === 'eFilter') TABS.entries.update();
  else if (t.id === 'jClass') { S.judgeClass = t.value; TABS.judging.update(); }
  else if (t.id === 'rClass') { S.resultClass = t.value; TABS.results.update(); }
});

/* ---------- navigation and refresh ---------- */
function switchTab(t){
  const ok = allowedTabs(); if (!ok.length) { renderHeader(); return; }
  if (!ok.includes(t)) t = ok[0];
  S.tab = t; renderHeader();
  if (!S.ready) return;
  TABS[t].mount(); TABS[t].update();
  window.scrollTo(0, 0);
}
function onData(){
  renderHeader();
  if (!S.ready) return;
  const t = TABS[S.tab]; if (!t) return;
  // rebuild option lists when class names change
  if (S.tab === 'register' && !$('#rows')) { if (!S.regDone) { t.mount(); } }
  t.update();
}
let lastClassSig = '';
function afterConfig(){
  const sig = JSON.stringify(cfg().classes) + cfg().open + cfg().anonymous;
  if (sig !== lastClassSig) {
    lastClassSig = sig;
    if (S.ready && (S.tab === 'entries' || S.tab === 'results' || (S.tab === 'register' && !S.regDone && !$$('.r-class').some(s => s.value) && !($('#exName') && $('#exName').value)))) { TABS[S.tab].mount(); }
  }
}

/* ---------- accounts, login and start ---------- */
let auth = null, fbStore = null, unsubs = [], dataUnsubs = [];
function stopData(){ dataUnsubs.forEach(u => { try { u(); } catch(e){} }); dataUnsubs = []; S.ready = false; S.pub = []; S.priv = {}; S.entries = []; S.scores = []; S.users = []; }
function teardown(){ stopData(); unsubs.forEach(u => { try { u(); } catch(e){} }); unsubs = []; S.me = null; S.fatal = false; S.sync = 'connecting'; }
function showFatal(title, body){ S.fatal = true; view().innerHTML = '<div class="card" style="max-width:640px;margin:1.5rem auto"><h2>' + esc(title) + '</h2><p style="margin-top:.6rem">' + body + '</p></div>'; }
function showLogin(){
  view().innerHTML = '<div class="card" style="max-width:440px;margin:1.5rem auto"><h2>Sign in</h2>' +
    '<p class="muted" style="margin:.4rem 0 1rem">Use the email and password your show admin gave you.</p>' +
    '<div class="field"><label for="lEmail">Email</label><input type="email" id="lEmail" autocomplete="username" autocapitalize="off"></div>' +
    '<div class="field"><label for="lPw">Password</label><input type="password" id="lPw" autocomplete="current-password"></div>' +
    '<div class="btnrow" style="margin-top:0"><button class="btn primary" data-action="login">Sign in</button><button class="btn ghost" data-action="forgot">Forgot password</button></div></div>';
}
function showNoAccess(title, body){
  view().innerHTML = '<div class="card" style="max-width:520px;margin:1.5rem auto"><h2>' + esc(title) + '</h2><p class="muted" style="margin:.5rem 0 1rem">' + esc(body) + '</p><button class="btn secondary" data-action="logout">Sign out</button></div>';
}
function openAccount(){
  if (!S.me) {
    openModal('<h2>' + (authMode ? 'Not signed in' : 'Saved on this device only') + '</h2><p class="muted" style="margin-top:.5rem">' +
      (authMode ? 'Sign in to use the show desk.' : 'This copy has no Firebase config yet, so nothing is shared and there are no accounts. Add your config to the file and upload it again.') +
      '</p><div class="btnrow"><button class="btn primary" data-action="close-modal">Close</button></div>');
    return;
  }
  openModal('<h2>' + esc(S.me.name || 'Your account') + '</h2><p class="muted" style="margin:.3rem 0 1rem">' + esc(S.me.email) + '<br>Role: <b>' + ROLE_LABEL[S.me.role] + '</b></p>' +
    '<div class="btnrow"><button class="btn secondary" data-action="reset-mine">Email me a password reset link</button><button class="btn primary" data-action="logout">Sign out</button><button class="btn secondary" data-action="close-modal">Close</button></div>');
}
function startLocal(){
  loadLocal(); pullLocal(); S.mode = 'local'; S.sync = 'local'; S.ready = true;
  lastClassSig = JSON.stringify(cfg().classes) + cfg().open + cfg().anonymous;
  switchTab(S.tab);
}
const fail = e => {
  S.sync = 'err'; renderHeader();
  if (e && e.code === 'permission-denied') showFatal('Firestore is blocking access', 'The database rules are missing or out of date. In Firebase, open Firestore Database, then Rules, paste the rules from the setup guide and press Publish. Then reload this page.');
  else if (!S.ready && e) showFatal('Could not reach the database', 'Check your internet connection and that Firestore is created in your Firebase project, then reload. Details: ' + esc(e.message || e.code || 'unknown error'));
};
function rebuildEntries(){ S.entries = S.pub.map(e => Object.assign({exhibitor: '', club: '', contact: '', paid: false}, e, S.priv[e.id] || {})); }
function startData(){
  stopData();
  const role = S.me.role, uid = S.me.uid;
  const need = {config: false, entries: false};
  if (role !== 'judge') need.priv = false;
  if (role === 'admin' || role === 'judge') need.scores = false;
  if (role === 'admin') need.users = false;
  const check = () => {
    if (!S.ready && !S.fatal && Object.values(need).every(Boolean)) {
      S.ready = true; lastClassSig = JSON.stringify(cfg().classes) + cfg().open + cfg().anonymous;
      S.tab = allowedTabs().includes(S.tab) ? S.tab : allowedTabs()[0]; switchTab(S.tab);
    }
  };
  const after = k => { if (k in need) need[k] = true; if (S.ready) onData(); else check(); };
  dataUnsubs.push(db.doc('config/show').onSnapshot(d => { S.config = d.exists ? mergeCfg(d.data()) : DEFAULT_CONFIG(); if (S.ready) afterConfig(); after('config'); }, fail));
  dataUnsubs.push(db.collection('entries').onSnapshot(q => { S.pub = q.docs.map(d => Object.assign({}, d.data(), {id: d.id})); rebuildEntries(); after('entries'); }, fail));
  if (need.priv !== undefined) dataUnsubs.push(db.collection('private').onSnapshot(q => { S.priv = {}; q.docs.forEach(d => { S.priv[d.id] = d.data(); }); rebuildEntries(); after('priv'); }, fail));
  if (need.scores !== undefined) {
    const col = role === 'admin' ? db.collection('scores') : db.collection('scores').where('judgeUid', '==', uid);
    dataUnsubs.push(col.onSnapshot(q => { S.scores = q.docs.map(d => d.data()); after('scores'); }, fail));
  }
  if (need.users !== undefined) dataUnsubs.push(db.collection('users').onSnapshot(q => { S.users = q.docs.map(d => Object.assign({}, d.data(), {id: d.id})); after('users'); }, fail));
  setTimeout(() => { if (!S.ready && !S.fatal) { Object.keys(need).forEach(k => { need[k] = true; }); check(); } }, 8000);
}
function watchProfile(user){
  unsubs.push(db.doc('users/' + user.uid).onSnapshot(d => {
    if (!d.exists) { stopData(); S.me = null; renderHeader(); showNoAccess('No access yet', 'Your sign-in works, but the admin has not given you a role. Ask them to add you in the Users tab.'); return; }
    const p = d.data();
    if (p.disabled || !ROLE_LABEL[p.role]) { stopData(); S.me = null; renderHeader(); showNoAccess('Account switched off', 'The admin has switched off this account. Ask them if you need access.'); return; }
    const roleChanged = !S.me || S.me.role !== p.role || !dataUnsubs.length;
    S.me = {uid: user.uid, email: user.email || p.email || '', name: p.name || user.email || '', role: p.role};
    S.sync = 'live'; renderHeader();
    if (roleChanged) startData();
  }, fail));
}
function init(){
  renderHeader();
  if (!FIREBASE_READY) { startLocal(); return; }
  let store;
  try { const app = fbInit(FIREBASE_CONFIG); auth = getAuth(app); store = getFirestore(app); }
  catch(e) { showFatal('Could not start Firebase', 'Check that the config pasted into the file is complete and copied exactly.'); return; }
  db = makeDb(store);
  onAuthStateChanged(auth, user => {
    teardown(); renderHeader();
    if (!user) { showLogin(); return; }
    watchProfile(user);
  });
}
init();
})();
</script>
